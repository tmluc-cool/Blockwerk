name: zz-windows-debug
on:
  push:
    branches: [phase/04-umgebung]
    paths: ['.github/workflows/zz-windows-debug.yml']
jobs:
  debug:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm assets:fetch
      - run: pnpm --filter @blockwerk/editor build
      - run: pnpm exec playwright test --project=editor -g "probe"
# probe rerun: cheaper studio drawing
# timing probe
