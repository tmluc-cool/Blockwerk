name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, Prettier, licenses)
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The asset library (CC0 models, previews) is built from pinned sources and cached; it
      # only changes when the source descriptions or the pipeline change.
      - name: Cache asset library
        uses: actions/cache@v4
        with:
          path: library
          key: library-${{ runner.os }}-${{ hashFiles('packages/library/sources/**', 'packages/library/scripts/**', 'pnpm-lock.yaml') }}

      - name: Build asset library
        run: pnpm assets:fetch

      - name: Unit and golden tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: End-to-end tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm exec playwright test

      - name: End-to-end tests (Windows)
        if: runner.os == 'Windows'
        run: pnpm exec playwright test

      - name: Upload screenshots and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore
