name: Pages

# Builds the web site: the start page, the editor in the browser and playable web builds of the
# example games, and publishes it on GitHub Pages (SPEC phase 11). Pages has to be switched on once
# in the repository settings (Settings -> Pages -> Source: GitHub Actions). Changes to this
# workflow and to the site run the same build as a dry run (nothing is published).

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/pages.yml
      - docs/site/**
      - scripts/make-site.mjs
      - scripts/site-games.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The previews of the asset library are rendered in a browser.
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Cache asset library
        uses: actions/cache@v4
        with:
          path: library
          key: library-${{ runner.os }}-${{ hashFiles('packages/library/sources/**', 'packages/library/scripts/**', 'pnpm-lock.yaml') }}

      - name: Build asset library
        run: pnpm assets:fetch

      - name: Build editor and player
        run: pnpm build

      - name: Assemble the site
        run: node scripts/make-site.mjs site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Publish
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
