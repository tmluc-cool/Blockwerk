name: New block
description: Propose a block for the block catalog.
labels: [block]
body:
  - type: input
    id: text-en
    attributes:
      label: Block text (English)
      placeholder: move ( ) m forward
    validations:
      required: true
  - type: input
    id: text-de
    attributes:
      label: Block text (German, optional)
      description: The block needs a German text before it is merged; maintainers can help with it.
      placeholder: gehe ( ) Meter vorwärts
  - type: dropdown
    id: shape
    attributes:
      label: Shape
      options:
        - Hat (event)
        - Stack (command)
        - Reporter (value)
        - Boolean (condition)
        - C block
        - Cap
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      placeholder: Motion
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: What does it do at runtime? Is there a Unity counterpart?
    validations:
      required: true
