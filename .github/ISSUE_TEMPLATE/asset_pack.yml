name: New asset pack
description: Propose a pack for the asset library (CC0 only).
labels: [assets]
body:
  - type: input
    id: url
    attributes:
      label: Source URL
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License
      description: Only CC0 is accepted for the bundled library.
      placeholder: CC0-1.0
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: Content
      description: Categories, number of models, animated characters?
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirmation
      options:
        - label: The pack is CC0 and contains no Mixamo or paid-store files.
          required: true
