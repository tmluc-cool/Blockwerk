name: Suggest an idea
description: A new feature or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Which problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How does Unity do it? How should it look in Blockwerk?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
