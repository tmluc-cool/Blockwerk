name: Fehler melden / Bug report
description: Etwas funktioniert nicht wie erwartet. / Something does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Was ist passiert? / What happened?
      description: Beschreibe den Fehler und was du stattdessen erwartet hast. / Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Nachstellen / Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Wo? / Where?
      options:
        - Desktop-App (Windows)
        - Browser
        - Exportiertes Spiel / Exported game
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: z. B. / e.g. 0.1.0 oder Commit
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, Konsole, Projektdatei / Screenshots, console, project file
      description: Meldungen aus der Konsole helfen sehr. / Console messages help a lot.
